<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>Acompanhamento — Rota de Campo</title></head><body><header><h1>Acompanhamento em tempo real</h1></header><main><div class="card"><div id="head">Carregando…</div></div><div id="map" class="map"></div><div class="card"><h3>Equipes</h3><div id="legend"></div><p class="muted">Atualização automática a cada 10 segundos. O mapa representa trajetos GPS registrados e não comprova, isoladamente, entrega em cada residência.</p></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
const pub=qs('t'); let map=L.map('map').setView([-31.77,-52.34],12), layers={}; L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
async function refresh(){const {data,error}=await sb.rpc('get_public_operation',{p_token:pub}); if(error||!data){head.innerHTML='<span class="err">Operação não encontrada.</span>';return;} head.innerHTML=`<h2>${esc(data.operation.name)}</h2><p>${esc(data.operation.client_name||'')} · ${esc(data.operation.area_name||'')}</p><span class="pill">${data.teams.length} equipe(s)</span>`; let bounds=[]; legend.innerHTML=''; for(const team of data.teams){const pts=team.points.map(p=>[p.lat,p.lng]); if(!layers[team.id]) layers[team.id]={line:L.polyline([],{}).addTo(map),marker:null}; layers[team.id].line.setLatLngs(pts); if(pts.length){const last=pts[pts.length-1]; if(!layers[team.id].marker) layers[team.id].marker=L.marker(last).addTo(map).bindTooltip(team.name); else layers[team.id].marker.setLatLng(last); bounds.push(...pts);} let dist=0; for(let i=1;i<team.points.length;i++)dist+=hav(team.points[i-1],team.points[i]); legend.insertAdjacentHTML('beforeend',`<div class="team"><b>${esc(team.name)}</b> · ${fmtKm(dist)} · ${team.active?'🟢 em campo':'⚪ sem sessão ativa'}</div>`);} if(bounds.length&&!map._fitted){map.fitBounds(bounds,{padding:[25,25]});map._fitted=true;}}
refresh();setInterval(refresh,10000);
</script></body></html>
