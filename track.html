<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Equipe — Rota de Campo</title></head><body><header><h1>Rota de Campo — Equipe</h1></header><main><div class="card"><div id="info">Carregando equipe…</div><p class="muted">A localização só será registrada depois de tocar em INICIAR e será interrompida ao ENCERRAR.</p><button id="start" class="big success" disabled>INICIAR PERCURSO</button><p><button id="stop" class="big danger" disabled>ENCERRAR PERCURSO</button></p><div id="status"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
let team=null,session=null,watchId=null,last=null,km=0; const t=qs('t'), info=document.querySelector('#info'), status=document.querySelector('#status');
(async()=>{const {data,error}=await sb.rpc('get_team_by_token',{p_token:t}); if(error||!data?.length){info.innerHTML='<span class="err">Link de equipe inválido.</span>';return;} team=data[0]; info.innerHTML=`<h2>${esc(team.team_name)}</h2><p>${esc(team.operation_name)} · ${esc(team.area_name||'')}</p>`; start.disabled=false;})();
start.onclick=async()=>{ if(!navigator.geolocation)return status.textContent='GPS não disponível neste aparelho.'; const {data,error}=await sb.rpc('start_tracking_session',{p_token:t}); if(error)return status.textContent=error.message; session=data; start.disabled=true; stop.disabled=false; status.innerHTML='<span class="ok">GPS ativo. Mantenha esta página aberta durante o percurso.</span>'; watchId=navigator.geolocation.watchPosition(savePos,e=>status.innerHTML='<span class="err">GPS: '+esc(e.message)+'</span>',{enableHighAccuracy:true,maximumAge:5000,timeout:20000}); };
async function savePos(p){ const cur={lat:p.coords.latitude,lng:p.coords.longitude}; if(last){const d=hav(last,cur); if(d<1)km+=d;} last=cur; status.textContent=`GPS ativo · precisão ±${Math.round(p.coords.accuracy)} m · ${fmtKm(km)}`; const {error}=await sb.rpc('add_track_point',{p_session:session,p_token:t,p_lat:cur.lat,p_lng:cur.lng,p_accuracy:p.coords.accuracy,p_speed:p.coords.speed,p_heading:p.coords.heading}); if(error)status.innerHTML='<span class="err">Falha ao enviar ponto: '+esc(error.message)+'</span>'; }
stop.onclick=async()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId); await sb.rpc('stop_tracking_session',{p_session:session,p_token:t}); watchId=null; stop.disabled=true; start.disabled=false; status.innerHTML='<b>Percurso encerrado.</b> Distância aproximada: '+fmtKm(km); session=null;last=null;km=0;};
</script></body></html>
