<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Admin — Rota de Campo</title></head><body><header><h1>Rota de Campo — Administrador</h1></header><main>
<div class="card"><h2>Nova operação</h2><div class="grid"><input id="name" placeholder="Nome da operação"><input id="client" placeholder="Contratante"><input id="area" placeholder="Bairro / área"></div><p><button id="create">Criar operação</button></p><div id="msg"></div></div>
<div class="card" id="opbox" hidden><h2 id="opname"></h2><p>Link público: <code id="publink"></code></p><p><button id="copyPublic" class="secondary">Copiar link público</button></p><hr><h3>Adicionar equipe</h3><div class="row"><input id="teamname" placeholder="Ex.: Equipe 01"><button id="addteam">Adicionar</button></div><div id="teams"></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
let op=null;
const msg=document.querySelector('#msg'), box=document.querySelector('#opbox'), teams=document.querySelector('#teams');
document.querySelector('#create').onclick=async()=>{ const n=name.value.trim(); if(!n)return msg.textContent='Informe o nome.'; const public_token=token(); const {data,error}=await sb.from('operations').insert({name:n,client_name:client.value.trim(),area_name:area.value.trim(),public_token}).select().single(); if(error){msg.innerHTML='<span class="err">'+esc(error.message)+'</span>';return;} op=data; box.hidden=false; opname.textContent=data.name; publink.textContent=base()+'public.html?t='+data.public_token; msg.innerHTML='<span class="ok">Operação criada.</span>'; };
document.querySelector('#copyPublic').onclick=()=>navigator.clipboard.writeText(publink.textContent);
document.querySelector('#addteam').onclick=async()=>{ if(!op)return; const n=teamname.value.trim(); if(!n)return; const track_token=token(); const {data,error}=await sb.from('teams').insert({operation_id:op.id,name:n,track_token}).select().single(); if(error)return alert(error.message); const link=base()+'track.html?t='+data.track_token; teams.insertAdjacentHTML('beforeend',`<div class="team"><b>${esc(data.name)}</b><br><code>${esc(link)}</code><br><button class="secondary copy" data-link="${esc(link)}">Copiar link da equipe</button></div>`); teamname.value=''; };
teams.addEventListener('click',e=>{if(e.target.classList.contains('copy'))navigator.clipboard.writeText(e.target.dataset.link)});
</script></body></html>
